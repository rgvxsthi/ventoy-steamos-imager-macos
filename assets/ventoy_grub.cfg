# =====================================================
# SteamOS Repair / Install - Custom Ventoy GRUB Entry
# =====================================================
# Shown in Ventoy's F6 (Custom boot config) menu.
# Chainloads SteamOS's own grub, which boots the recovery image.
# The 'efi' fs label lives on the cloned SteamOS "efi" partition
# (/EFI/steamos/grubx64.efi). SteamOS then finds rootfs/var by
# fs-uuid + PARTUUID, both preserved by the installer.

menuentry 'SteamOS Repair / Install' --class steamos --class gnu-linux --class gnu --class os {
    insmod part_gpt
    search --label efi --set=root
    chainloader /EFI/steamos/grubx64.efi

    echo ""
    echo "Booting SteamOS Repair / Install In 5 Seconds"
    echo ""
    for i in 5 4 3 2 1; do
        echo " $i..."
        sleep 1
    done
}
